name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: HACS validation
    # HACS supports public repositories only; related: README.md validation guidance.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository with HACS
        uses: hacs/action@22.5.0
        with:
          category: integration
          # This repository has no license; see README.md development tests.
          ignore: license

  validate-hassfest:
    name: Hassfest validation
    # Checkout needs repository read access for private repositories; related: actions/checkout.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
